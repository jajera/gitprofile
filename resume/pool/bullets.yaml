bullets:
- id: geonet-aws-migration
  role_id: geonet-platform
  tags:
  - aws
  - migration
  - networking
  - security
  text: Heavily involved in GeoNet's migration to AWS, helping design, build, configure, and operationalise
    cloud infrastructure and resolving platform, networking, security, and deployment blockers across
    multiple migration workstreams.
- id: geonet-aws-accounts-akl
  role_id: geonet-platform
  tags:
  - aws
  - networking
  - accounts
  text: Designed and configured multiple AWS accounts in the Auckland region, establishing the underlying
    network connectivity and account foundations required to migrate and operate services independently
    while maintaining controlled connectivity between environments.
- id: geonet-multi-account-networking
  role_id: geonet-platform
  tags:
  - aws
  - networking
  - transit-gateway
  - vpc
  text: Designed and implemented AWS multi-account networking, including VPC connectivity, inter-VPC routing,
    AWS Transit Gateway, and inter-region connectivity, working across network, security, application,
    and platform teams to unblock migrations and establish reliable service-to-service communication.
- id: geonet-terraform-leadership
  role_id: geonet-platform
  tags:
  - terraform
  - iac
  - aws
  text: Provided significant hands-on Infrastructure as Code leadership using Terraform, developing and
    reviewing reusable infrastructure, account configuration, networking, security, compute, and application
    platform changes. Used Terraform as the primary mechanism for repeatable, reviewable, and consistent
    AWS deployments.
- id: geonet-unblock-e2e
  role_id: geonet-platform
  tags:
  - aws
  - troubleshooting
  - iam
  - dns
  - networking
  text: Unblocked AWS migration and deployment issues end-to-end, investigating problems across networking,
    IAM, DNS, routing, security controls, containers, infrastructure, and application dependencies rather
    than treating individual infrastructure components in isolation.
- id: geonet-ecs-eks-hosting
  role_id: geonet-platform
  tags:
  - aws
  - ecs
  - eks
  - kubernetes
