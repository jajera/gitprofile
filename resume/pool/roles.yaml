roles:
- id: geonet-platform
  title: Platform Engineer
  organization: Earth Sciences New Zealand (GeoNet)
  organization_aliases:
  - Earth Sciences NZ
  - GNS Science
  - GeoNet
  location: Wellington, New Zealand
  start: 2023-07
  end: present
  summary: Own infrastructure, performance, and security for GeoNet platforms that deliver critical earthquake
    and tsunami data to emergency management, the public, and scientists. Platforms run on AWS and on-premises,
    with Amazon ECS, Amazon EKS, Amazon RDS, and Linux VMs. Work is Terraform, Puppet, Packer, GitHub
    Actions, Datadog, Docker/Podman, and application-facing platform support.
  summary_alternates:
  - Owned and delivered GeoNet platforms across on-premises and AWS, including Amazon EKS and Amazon RDS,
    ensuring secure, scalable, and highly available delivery of critical data to emergency management,
    public channels, and the scientific community; managed infrastructure as code using Terraform, Puppet,
    and Packer; built and maintained CI/CD pipelines with GitHub Actions; and drove containerization and
    workload modernization using Podman across virtual machines, EC2, Amazon ECS, and Kubernetes workloads
    on EKS.
  - Responsible for GeoNet platforms, security, and remote networks, leveraging Free and Open Source Software
    to ensure GeoNet's timely delivery of critical information to emergency management, public channels,
    and the scientific community worldwide. Managed all infrastructure as code using Terraform, Puppet,
    and Packer. Significant role in GitHub Actions CI/CD and containerization — Podman on VMs and EC2,
    plus services on ECS.
